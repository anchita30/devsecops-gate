name: Supply Chain Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devsecops-gate-demo:${{ github.sha }} .

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: devsecops-gate-demo:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
        
      - name: Scan SBOM for CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: sbom
          scan-ref: sbom.cyclonedx.json
          format: json
          output: trivy-cve-report.json
          exit-code: 0
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Upload CVE report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cve-report
          path: trivy-cve-report.json
