name: Supply Chain Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: "ghcr.io/${{ github.repository_owner }}/devsecops-gate-demo"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json

      - name: Scan SBOM for CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: sbom
          scan-ref: sbom.cyclonedx.json
          format: json
          output: trivy-cve-report.json
          exit-code: 0
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Upload CVE report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cve-report
          path: trivy-cve-report.json

      - name: Scan for license issues
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          scanners: license
          format: json
          output: license-report.json
          exit-code: 0
        env:
          TRIVY_PKG_TYPES: library

      - name: Upload license report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: license-report.json

      - name: Run policy gate
        
        run: |
          pip install pyyaml
          python3 scripts/policy_gate.py

      - name: Log in to GitHub Container Registry
        if: success()
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: success()
        run: docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Install cosign
        if: success()
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless)
        if: success()
        run: cosign sign --yes ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Verify signature before deploy
        if: success()
        run: |
          cosign verify ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"

      - name: Simulate deploy
        if: success()
        run: echo "✅ Signature verified. Deploying ${{ env.IMAGE_NAME }}:${{ github.sha }} now."